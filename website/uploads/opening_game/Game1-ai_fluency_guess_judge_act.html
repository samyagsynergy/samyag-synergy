<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Fluency: Guess, Judge, Act</title>
<style>
:root{--navy:#17324d;--blue:#2563eb;--green:#15803d;--red:#b91c1c;--amber:#b45309;--ink:#1f2937;--muted:#64748b;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:24px 16px 42px}header{background:linear-gradient(135deg,var(--navy),#285b83);color:#fff;padding:28px;border-radius:18px;box-shadow:0 9px 26px #0002}h1{margin:0 0 8px;font-size:clamp(1.75rem,4vw,2.65rem)}header p{margin:0;line-height:1.55}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.step{background:#fff;border-radius:12px;padding:14px;box-shadow:0 3px 12px #0001}.step strong{display:block;color:var(--navy);font-size:1.1rem;margin-bottom:4px}.instructions,.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 16px #00000012;margin:15px 0}.instructions{border-left:5px solid var(--blue);line-height:1.55}.tip{color:var(--muted);font-size:.92rem;margin-top:9px}.rounds{display:flex;gap:10px;margin:18px 0}.round{flex:1;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:800;cursor:pointer;background:#dbe3ef;color:var(--navy)}.round.active{background:var(--blue);color:#fff}.meta{color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.86rem}.statement{font-size:clamp(1.2rem,2.5vw,1.72rem);line-height:1.43;color:var(--navy);margin:14px 0 21px}.question-label{font-weight:800;color:var(--navy);margin:17px 0 9px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.choice{min-height:62px;border:2px solid #d7dfeb;background:#fff;border-radius:11px;padding:11px;font:inherit;font-weight:750;cursor:pointer;transition:.15s}.choice:hover,.choice.selected{border-color:var(--blue);background:#eff6ff;transform:translateY(-2px)}.choice.correct{border-color:var(--green);background:#dcfce7;color:#166534}.choice.wrong{border-color:var(--red);background:#fee2e2;color:#991b1b}.choice.dim{opacity:.55}.choice:disabled{cursor:default}.reveal{display:none;margin-top:18px;padding:16px;border-radius:11px;background:#f0fdf4;border:1px solid #bbf7d0;line-height:1.58}.reveal.show{display:block}.reveal h3{margin:0 0 7px;color:var(--green)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.primary,.secondary{border:0;border-radius:10px;padding:12px 17px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.primary:disabled{background:#94a3b8;cursor:not-allowed}.secondary{background:#e2e8f0;color:var(--navy)}.progress{height:9px;background:#dbe3ef;border-radius:99px;overflow:hidden;margin:17px 0}.bar{height:100%;background:var(--blue);width:0;transition:.25s}.result{text-align:center}.score{font-size:2.5rem;font-weight:900;color:var(--navy)}.badge{display:inline-block;padding:6px 10px;border-radius:99px;font-weight:800;font-size:.88rem}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}@media(max-width:700px){.steps{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.rounds{flex-direction:column}.actions{flex-direction:column}.primary,.secondary{width:100%}}
.banner{display:none;background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:700}.lv{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:62px;border:2px solid #d7dfeb;background:#fff;border-radius:11px;padding:11px;font-weight:750}.lv::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--p,0%);background:#dbeafe;transition:width .4s}.lv>*{position:relative}.lv.correct{border-color:var(--green);color:#166534}.lv.correct::before{background:#86efac}.lv.dim{opacity:.55}.live{color:var(--muted);font-weight:700;margin:-8px 0 8px}
</style></head><body><div class="wrap"><header><h1>AI Fluency: Guess, Judge, Act</h1><p>An unplugged opening and closing game for finance, business, and CA professionals.</p></header><div id="banner" class="banner"></div><div class="steps"><div class="step"><strong>1. Guess</strong>Does it sound Human, AI, or Both?</div><div class="step"><strong>2. Judge</strong>Is it accurate, appropriate, and safe?</div><div class="step"><strong>3. Act</strong>Use, verify, modify, or reject?</div></div><div class="rounds"><button id="opening" class="round active">Opening round</button><button id="closing" class="round">Closing round</button></div><div id="instructions" class="instructions"></div><div class="progress"><div id="bar" class="bar"></div></div><main id="game" class="card"></main></div>
<script>
const opening=[
{area:'Finance',text:'“A company’s revenue increased by 25%, so its profitability must also have improved.”',source:'AI',action:'Verify and improve',why:'This contains a reasoning error. Revenue growth does not prove profit growth; costs, margins, provisions, interest and tax also matter.',sourceWhy:'The statement is presented as an AI-generated example. However, a human could make the same error—source detection is not a substitute for review.'},
{area:'Business',text:'“Please draft a polite email informing the client that the project deadline has moved by one week.”',source:'Both',action:'Use after a quick review',why:'AI can prepare a draft, but a human must provide the facts, check the tone and date, consider contractual consequences, and approve it.',sourceWhy:'This is a suitable human–AI collaboration: AI helps with wording, while the human supplies context and accountability.'},
{area:'CA practice',text:'“This tax interpretation includes a section reference, so it is safe to rely on it without checking the source.”',source:'AI',action:'Verify and improve',why:'A reference is not proof of accuracy. Check the actual law, circular, case law, amendments, date, jurisdiction and facts.',sourceWhy:'AI can generate convincing but inaccurate citations or misapply a genuine reference.'},
{area:'Finance',text:'“The cash-flow forecast shows a funding gap. Before recommending action, I will check assumptions, timing and sensitivity to delayed collections.”',source:'Human',action:'Use after a quick review',why:'This demonstrates professional judgement. AI may help model scenarios, but humans must assess whether assumptions are realistic.',sourceWhy:'The emphasis is on professional judgement and critical evaluation rather than confident automation.'},
{area:'Business / Privacy',text:'“Paste the complete confidential client file into a public AI tool so it can prepare the analysis faster.”',source:'AI',action:'Do not use as proposed',why:'This is unsafe. Confidentiality, privacy, contractual restrictions, approved-tool requirements and organisational policy must be considered.',sourceWhy:'The example represents an unsafe AI-style recommendation. A human may also suggest it, which is why privacy controls matter regardless of authorship.'},
{area:'CA practice',text:'“Use AI to compare two versions of a checklist, then review every difference before finalising the controlled document.”',source:'Both',action:'Use after a quick review',why:'AI can accelerate comparison, while a human remains responsible for interpretation, completeness, version control and final approval.',sourceWhy:'This is a practical human–AI workflow with clear human oversight.'}
];
const closing=[
{area:'Finance',text:'“The company’s revenue increased by 25%, so its profitability must also have improved.”',source:'Not important',action:'Verify and improve',why:'Do not accept the conclusion. Check costs, margins, provisions, finance costs, tax and actual profit figures.',sourceWhy:'At the end, the more useful question is not who wrote it, but whether the conclusion is reliable.'},
{area:'CA practice',text:'“This tax answer includes a section reference, so it can be relied upon without checking the source.”',source:'Not important',action:'Verify and improve',why:'Check the primary source and whether it applies to the relevant period, jurisdiction and facts.',sourceWhy:'A citation can be wrong, incomplete or misapplied. Verification remains necessary.'},
{area:'Confidentiality',text:'“Paste the complete client file into a public AI tool so the analysis can be completed faster.”',source:'Not important',action:'Do not use as proposed',why:'Reject this approach unless an approved, secure process exists. Consider anonymisation, data minimisation and firm policy.',sourceWhy:'The closing skill is risk-aware action: protect confidential information before seeking productivity gains.'}
];
let mode='opening',i=0,phase=0,run=rid(),cnt={s:{},a:{}},tot=0,joined=0;
const CONFIG={SHEET_URL:'https://script.google.com/macros/s/AKfycbylTdeiWUb2h1yNV2401JGh4Gfm2JFPe0u2Xq_k69HVVEb2KhTEwfGARRwKswFuHPDJ/exec'};
const src={Human:'🧑 Human',AI:'🤖 AI',Both:'🤝 Both / collaborative','Not important':'🔎 The source is not the main issue'},act={'Use after a quick review':'🟢 Use after a quick review','Verify and improve':'🟡 Verify and improve','Do not use as proposed':'🔴 Do not use as proposed'};
const SRCK=['Human','AI','Both'],ACTK=Object.keys(act),PH=['vote','reveal'];
const voteUrl=location.href.split('#')[0].replace(/[^\/]*$/,'')+'game1-vote.html';
const KEY=prompt('Facilitator key (the GAME_KEY set in Code.gs)')||'';
function rid(){return Math.random().toString(36).slice(2,6)}
const cur=()=>mode==='opening'?opening:closing;
const stepKey=k=>(mode==='opening'?'o':'c')+(i+1)+k+'-'+run;
function jp(params,cb){const n='cb'+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement('script');const t=setTimeout(()=>{done();cb&&cb(null)},8000);function done(){clearTimeout(t);delete window[n];s.remove()}window[n]=d=>{done();cb&&cb(d)};s.onerror=()=>{done();cb&&cb(null)};s.src=CONFIG.SHEET_URL+'?'+new URLSearchParams(Object.assign({},params,{callback:n})).toString();document.body.appendChild(s)}
function banner(m){const b=document.getElementById('banner');b.textContent=m;b.style.display=m?'block':'none'}
function push(st){jp({action:'gset',key:KEY,state:JSON.stringify(st)},d=>banner(d&&d.ok?'':'⚠ '+(d?d.error:'Cannot reach the vote server. Check the web app URL and the internet.')))}
function instructions(){document.getElementById('instructions').innerHTML=(mode==='opening'?'<b>Opening round — What do you think?</b><br>':'<b>Closing round — What would you do now?</b><br>')+'Join on your phone: <b>'+voteUrl+'</b> and enter your name. '+(mode==='opening'?'For each statement, vote on who wrote it (Human, AI or Both) and on what should happen to the output. Both questions are on the same phone screen.':'Now focus on professional action: vote on what you would do with each output.')+'<div class="tip">Facilitator: ask one or two participants why they voted that way before you reveal the answer.</div>'}
function render(){const a=cur(),q=a[i];instructions();document.getElementById('bar').style.width=i/a.length*100+'%';
const grp=(t,keys,lab,id)=>'<div class="question-label">'+t+'</div><div class="choices" id="'+id+'">'+keys.map(k=>'<div class="lv" data-k="'+k+'"><span>'+lab[k]+'</span><b>0</b></div>').join('')+'</div>';
document.getElementById('game').innerHTML='<div class="meta">Example '+(i+1)+' of '+a.length+' · '+q.area+'</div><div class="statement">'+q.text+'</div><div id="live" class="live"></div>'+(mode==='opening'?grp('Guess the source',SRCK,src,'gs'):'')+grp('What should you do with this output?',ACTK,act,'ga')+'<div id="reveal" class="reveal"><h3 id="title"></h3><div id="explain"></div></div><div class="actions"><button id="restart" class="secondary">Restart round</button><button id="next" class="primary"></button></div>';
document.getElementById('next').onclick=next;document.getElementById('restart').onclick=()=>{i=0;phase=0;run=rid();cnt={s:{},a:{}};tot=0;render()};
paint();push({round:mode,i:i,n:i+1,of:a.length,phase:PH[phase],run:run,text:q.text});fetchRes()}
function paint(){const a=cur(),q=a[i];
[['gs','s',SRCK,q.source],['ga','a',ACTK,q.action]].forEach(([id,k,keys,right])=>{const g=document.getElementById(id);if(!g)return;const c=cnt[k],t=keys.reduce((s,x)=>s+(c[x]||0),0),show=phase>=1;g.querySelectorAll('.lv').forEach(el=>{const x=el.dataset.k,n=c[x]||0;el.style.setProperty('--p',(t?n/t*100:0)+'%');el.querySelector('b').textContent=n+(t?' ('+Math.round(n/t*100)+'%)':'');el.classList.toggle('correct',show&&x===right);el.classList.toggle('dim',show&&x!==right)})});
const r=document.getElementById('reveal'),ti=document.getElementById('title'),ex=document.getElementById('explain');
if(phase===1){ti.textContent='Recommended action: '+act[q.action];ex.innerHTML='<p>'+q.why+'</p>'+(mode==='opening'?'<p><b>Source reveal:</b> '+src[q.source]+'</p><p>'+q.sourceWhy+'</p>':'');r.classList.add('show')}
else r.classList.remove('show');
document.getElementById('next').textContent=['Show the answer',i===a.length-1?'Finish round':'Next example →'][phase];
document.getElementById('live').textContent='👥 '+tot+' voted · '+joined+' joined'}
function fetchRes(){const kinds=mode==='opening'?['s','a']:['a'];kinds.forEach(k=>{const key=stepKey(k);jp({action:'gresults',step:key},d=>{if(!d||!d.ok||key!==stepKey(k)||!document.getElementById('live'))return;cnt[k]=d.counts;if(k==='a')tot=d.total;joined=d.joined;paint()})})}
function next(){const a=cur();if(phase<1)phase++;else if(i<a.length-1){i++;phase=0;cnt={s:{},a:{}};tot=0}else return finish();render()}
function finish(){document.getElementById('bar').style.width='100%';const msg=mode==='opening'?'Now begin the course. At the end, return to the Closing round and apply the learning.':'You have completed the closing round. The goal is not to detect AI perfectly; it is to make accurate, safe and professionally responsible decisions.';
document.getElementById('game').innerHTML='<div class="result"><div class="meta">Round complete</div><h2>'+msg+'</h2><button class="primary" id="again">Play this round again</button></div>';
document.getElementById('again').onclick=()=>{i=0;phase=0;run=rid();cnt={s:{},a:{}};tot=0;render()};
push({round:mode,phase:'done',run:run,text:''})}
function setMode(m){mode=m;i=0;phase=0;run=rid();cnt={s:{},a:{}};tot=0;document.getElementById('opening').classList.toggle('active',m==='opening');document.getElementById('closing').classList.toggle('active',m==='closing');render()}
document.getElementById('opening').onclick=()=>setMode('opening');document.getElementById('closing').onclick=()=>setMode('closing');
setInterval(fetchRes,3000);render();
</script></body></html>
