<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diwali Tambola</title>
<style>
:root{--bg:#3b0a14;--card:#5a1423;--cell:#7a2236;--gold:#ffc23c;--txt:#fff4e0;--dim:#d9b99a}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;padding:12px;max-width:640px}
h1{font-size:20px;text-align:center;color:var(--gold);margin:6px 0}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.big{font-size:96px;font-weight:800;color:var(--gold);text-align:center;line-height:1.1}
.dim{color:var(--dim);font-size:13px;text-align:center}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--gold);color:#3b0a14;font-weight:700}
button:disabled{opacity:.5}
.roll{width:100%;font-size:22px;padding:16px;margin-top:8px}
.recent{display:flex;gap:8px;justify-content:center;margin-top:8px;min-height:40px}
.recent span{background:var(--cell);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-weight:700}
.tk{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin-top:8px}
.tk div{aspect-ratio:1;display:grid;place-items:center;border-radius:6px;background:var(--cell);font-weight:700;font-size:clamp(13px,4.2vw,20px)}
.tk .e{background:transparent}
.bd{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.bd div{text-align:center;padding:5px 0;border-radius:5px;background:var(--cell);font-size:13px}
.hit{background:var(--gold)!important;color:#3b0a14}
.row{display:flex;gap:6px;align-items:center;margin:8px 0}
.row input{flex:1;min-width:0;padding:10px;border-radius:10px;border:0;font:inherit}
.row b{width:26px;text-align:center}
.row small{width:86px;text-align:right;font-size:12px}
.wa{background:#25d366;color:#fff;padding:10px 12px}
</style></head>
<body><div id="app"></div>
<script>
// >>> Paste your Cloudflare Worker URL here (no slash at the end)
const API = "https://YOUR-WORKER.workers.dev";

const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search), app = $("app");
let called = [];

// Same ticket number always gives the same valid tambola ticket
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function ticket(n){
  const r = rng(n*7919+2026), sh = a => a.map(x=>[r(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  let rows;
  for(;;){
    rows = [0,1,2].map(()=>sh([0,1,2,3,4,5,6,7,8]).slice(0,5));
    const cnt = Array(9).fill(0); rows.forEach(rw=>rw.forEach(c=>cnt[c]++));
    if(cnt.every(c=>c>=1&&c<=3)) break;
  }
  const g = [0,1,2].map(()=>Array(9).fill(0));
  for(let c=0;c<9;c++){
    const lo = c==0?1:c*10, hi = c==8?90:c*10+9, pool = [];
    for(let v=lo;v<=hi;v++) pool.push(v);
    const ri = [0,1,2].filter(i=>rows[i].includes(c));
    sh(pool).slice(0,ri.length).sort((a,b)=>a-b).forEach((v,k)=>g[ri[k]][c]=v);
  }
  return g;
}

async function get(){ try{ const r = await fetch(API+"/state"); called = (await r.json()).called||[]; }catch(e){} }
function poll(f){ const go = async()=>{ await get(); f(); }; go(); setInterval(go,2500); }
function recent(){ return called.slice(-6,-1).reverse().map(x=>`<span>${x}</span>`).join(""); }

function family(n){
  const t = ticket(n);
  app.innerHTML = `<h1>🪔 Diwali Tambola 🪔</h1>
  <div class="card"><div class="dim">Latest number</div><div class="big" id="cur">–</div><div class="recent" id="rec"></div></div>
  <div class="card"><div class="dim">Your ticket #${n} · <span id="cnt">0</span>/15 called</div><div class="tk" id="tk"></div></div>`;
  poll(()=>{
    $("cur").textContent = called.length ? called[called.length-1] : "–";
    $("rec").innerHTML = recent();
    let c = 0;
    $("tk").innerHTML = t.flat().map(v=>{
      if(!v) return '<div class="e"></div>';
      const h = called.includes(v); c += h;
      return `<div class="${h?"hit":""}">${v}</div>`;
    }).join("");
    $("cnt").textContent = c;
  });
}

function host(){
  let pin = sessionStorage.getItem("pin") || prompt("Host PIN");
  sessionStorage.setItem("pin", pin||"");
  let names = {}; try{ names = JSON.parse(localStorage.getItem("names")||"{}"); }catch(e){}
  const base = location.origin + location.pathname, T = {};
  let rows = "";
  for(let i=1;i<=15;i++){
    T[i] = ticket(i);
    rows += `<div class="row"><b>${i}</b><input id="n${i}" placeholder="Family / flat" value="${(names[i]||"").replace(/"/g,"&quot;")}"><button class="wa" data-i="${i}">WhatsApp</button><small id="s${i}"></small></div>`;
  }
  app.innerHTML = `<h1>🪔 Host Panel 🪔</h1>
  <div class="card"><div class="big" id="cur">–</div><div class="dim" id="info"></div><div class="recent" id="rec"></div>
  <button class="roll" id="roll">🎲 ROLL</button></div>
  <div class="card"><div class="dim">Numbers called</div><div class="bd" id="bd"></div></div>
  <div class="card"><div class="dim">Tickets issued · tap WhatsApp to send each family its link</div>${rows}</div>
  <div class="card"><button id="rs" style="background:#a33;color:#fff;width:100%">Reset game</button></div>`;

  function draw(){
    $("cur").textContent = called.length ? called[called.length-1] : "–";
    $("info").textContent = called.length + " of 90 called";
    $("rec").innerHTML = recent();
    let b = ""; for(let v=1;v<=90;v++) b += `<div class="${called.includes(v)?"hit":""}">${v}</div>`;
    $("bd").innerHTML = b;
    for(let i=1;i<=15;i++){
      const t = T[i]; let c = 0, lines = 0;
      t.forEach(rw=>{ const v = rw.filter(x=>x); const h = v.filter(x=>called.includes(x)).length; c += h; if(h==5) lines++; });
      $("s"+i).textContent = c==15 ? "🏆 FULL HOUSE" : c + "/15" + (lines ? " · " + lines + " line" + (lines>1?"s":"") : "");
      $("s"+i).style.color = c==15 ? "#ffc23c" : "";
    }
  }
  draw(); poll(draw);

  app.addEventListener("input", e=>{
    if(e.target.id && e.target.id[0]=="n"){ names[e.target.id.slice(1)] = e.target.value; try{ localStorage.setItem("names", JSON.stringify(names)); }catch(_){} }
  });
  app.addEventListener("click", e=>{
    const i = e.target.dataset && e.target.dataset.i; if(!i) return;
    const nm = $("n"+i).value.trim();
    const msg = `Hi${nm?" "+nm:""}! 🪔 Your Diwali Tambola ticket is #${i}. Open it here: ${base}?ticket=${i}`;
    window.open("https://wa.me/?text="+encodeURIComponent(msg), "_blank");
  });

  async function call(path){
    const r = await fetch(API+path, {method:"POST", body:JSON.stringify({pin})});
    if(r.status==401){ sessionStorage.removeItem("pin"); alert("Wrong PIN"); location.reload(); return false; }
    const d = await r.json(); if(d.called) called = d.called; return true;
  }
  $("roll").onclick = async()=>{
    $("roll").disabled = true;
    const iv = setInterval(()=>$("cur").textContent = 1+Math.floor(Math.random()*90), 70);
    let ok = true; try{ ok = await call("/roll"); }catch(e){ alert("Could not reach the server"); }
    setTimeout(()=>{ clearInterval(iv); if(ok) draw(); $("roll").disabled = false; }, 900);
  };
  $("rs").onclick = async()=>{ if(confirm("Reset all called numbers?")){ try{ await call("/reset"); draw(); }catch(e){ alert("Could not reach the server"); } } };
}

if(q.has("host")) host();
else if(q.get("ticket")>=1 && q.get("ticket")<=15) family(+q.get("ticket"));
else app.innerHTML = '<h1>🪔 Diwali Tambola 🪔</h1><div class="card dim">Please open the link your host sent you.</div>';
</script></body></html>
