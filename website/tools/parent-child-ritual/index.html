<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Samyag Synergy — Small stars, big bonds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7F3EA;
  --paper:#FFFFFF;
  --charcoal:#26251F;
  --charcoal-soft:#5C594E;
  --gold:#C9972E;
  --gold-light:#E8C97A;
  --gold-pale:#F3E4BE;
  --coral:#E4733F;
  --coral-pale:#FBE3D8;
  --teal:#2F7D6B;
  --teal-pale:#DCEDE8;
  --border:#E7E0CC;
  --radius:16px;
  --shadow: 0 2px 10px rgba(38,37,31,0.06);
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--charcoal);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:70px;
}
h1,h2,h3,.display{font-family:'Fredoka',sans-serif;font-weight:600;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 40px;}

/* ---------- Header ---------- */
header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 16px;max-width:960px;margin:0 auto;gap:12px;
}
.brand{display:flex;align-items:center;gap:12px;}
.mark{width:42px;height:42px;flex:0 0 auto;}
.brand-text h1{font-size:20px;margin:0;line-height:1.1;color:var(--charcoal);}
.brand-text p{margin:2px 0 0;font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.02em;}
.mode-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--paper);border:1px solid var(--border);color:var(--charcoal-soft);
  padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);
}
.mode-btn.parent-active{background:var(--charcoal);color:var(--gold-light);border-color:var(--charcoal);}

/* ---------- Tab bar ---------- */
.tabbar{
  display:flex;gap:6px;background:var(--paper);border:1px solid var(--border);border-radius:14px;
  padding:5px;margin:0 auto 20px;max-width:960px;box-shadow:var(--shadow);
}
.tab-btn{
  flex:1;border:none;background:none;padding:10px 6px;border-radius:10px;font-weight:600;font-size:13px;
  color:var(--charcoal-soft);display:flex;flex-direction:column;align-items:center;gap:2px;
}
.tab-btn .ic{font-size:17px;}
.tab-btn.active{background:var(--gold-pale);color:#7A5A12;}

/* ---------- Kid selector chips ---------- */
.kid-select-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;}
.kid-chip{
  display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;border:2px solid var(--border);
  background:var(--paper);flex:0 0 auto;font-weight:600;font-size:13px;color:var(--charcoal-soft);
}
.kid-chip .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;}
.kid-chip.active{border-color:var(--gold);color:var(--charcoal);background:var(--gold-pale);}

/* ---------- Cards / layout ---------- */
.kids-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:8px;}
.kid-card{
  background:var(--paper);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);
}
.kid-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.avatar{
  width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:26px;flex:0 0 auto;border:2px solid rgba(0,0,0,0.05);
}
.kid-head h3{margin:0;font-size:18px;}
.kid-head .sub{font-size:12px;color:var(--charcoal-soft);margin-top:2px;}

/* daily mini bar chart */
.week-chart{display:flex;justify-content:space-between;align-items:flex-end;height:70px;margin:4px 0 16px;padding:0 2px;}
.day-col{display:flex;flex-direction:column;align-items:center;gap:4px;width:13%;}
.day-col .val{font-size:10px;font-weight:700;color:var(--charcoal-soft);}
.day-col .stem{width:14px;background:var(--cream);border:1px solid var(--border);border-radius:6px;height:40px;display:flex;align-items:flex-end;overflow:hidden;}
.day-col .fill{width:100%;background:linear-gradient(180deg,var(--gold-light),var(--gold));border-radius:6px 6px 0 0;}
.day-col.today .stem{border-color:var(--gold);}
.day-col .lbl{font-size:10px;color:var(--charcoal-soft);font-weight:600;}
.day-col.today .lbl{color:var(--gold);}

.bar-row{margin-bottom:12px;}
.bar-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--charcoal-soft);margin-bottom:5px;font-weight:600;}
.bar-label .count{font-family:'Fredoka',sans-serif;font-size:13px;color:var(--charcoal);}
.bar-track{background:var(--cream);border:1px solid var(--border);border-radius:999px;height:12px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:999px;transition:width .4s ease;}
.bar-fill.week{background:linear-gradient(90deg,var(--gold),var(--gold-light));}
.bar-fill.month{background:var(--coral);}
.bar-fill.year{background:var(--teal);}
.reward-pill{
  display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;
  background:var(--gold-pale);color:#7A5A12;padding:3px 10px;border-radius:999px;font-weight:600;
}
.reward-pill.empty{background:var(--cream);color:var(--charcoal-soft);font-weight:500;}
.edit-pencil{border:none;background:none;color:var(--charcoal-soft);font-size:13px;padding:2px 4px;border-radius:6px;}
.edit-pencil:hover{background:var(--cream);}

.link-btn{background:none;border:none;color:var(--charcoal-soft);font-size:13px;font-weight:600;text-decoration:underline;padding:8px;}
.fab-row{display:flex;justify-content:center;margin:20px 0 8px;}

/* ---------- Ritual tab ---------- */
.ritual-shell{max-width:420px;margin:0 auto;text-align:center;}
.ritual-caption{font-size:13px;color:var(--charcoal-soft);margin:0 0 18px;}
.progress-dots{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:10px;letter-spacing:.03em;}
.ritual-card{
  background:var(--paper);border:1px solid var(--border);border-radius:24px;padding:40px 24px;
  box-shadow:0 6px 20px rgba(38,37,31,0.1);touch-action:pan-y;cursor:grab;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;
}
.rc-emoji{font-size:52px;margin-bottom:14px;}
.rc-text{font-family:'Fredoka',sans-serif;font-size:20px;font-weight:600;}
.rc-actions{display:flex;gap:10px;margin-top:20px;}
.rc-btn{flex:1;border:none;border-radius:14px;padding:14px 8px;font-weight:700;font-size:14px;}
.rc-btn.no{background:var(--coral-pale);color:#A34524;}
.rc-btn.maybe{background:var(--gold-pale);color:#7A5A12;}
.rc-btn.yes{background:var(--teal-pale);color:#1E5A4C;}
.rc-btn:active{transform:scale(0.97);}
.ritual-done{background:var(--paper);border:1px solid var(--border);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow);}
.ritual-done .big-star{font-size:40px;}
.ritual-summary-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--border);text-align:left;}
.ritual-summary-row .rs-left{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;}
.rs-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:none;}
.rs-badge.yes{background:var(--teal-pale);color:#1E5A4C;}
.rs-badge.no{background:var(--coral-pale);color:#A34524;}
.rs-badge.maybe{background:var(--gold-pale);color:#7A5A12;}

/* ---------- Empty / setup ---------- */
.empty-state{text-align:center;padding:60px 20px;color:var(--charcoal-soft);}
.empty-state .mark{width:64px;height:64px;margin:0 auto 14px;}
.empty-state h2{margin:0 0 6px;color:var(--charcoal);}

.setup-shell{max-width:520px;margin:40px auto;padding:0 16px 60px;}
.setup-card{background:var(--paper);border:1px solid var(--border);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow);}
.setup-card h2{margin:0 0 4px;font-size:22px;}
.setup-card .lead{color:var(--charcoal-soft);font-size:14px;margin:0 0 20px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--charcoal-soft);margin-bottom:6px;}
.field input, .field select{
  width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:var(--cream);
}
.field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:1px;}
.kid-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;background:var(--cream);padding:8px;border-radius:12px;border:1px solid var(--border);}
.kid-row input[type=text]{flex:1;border:none;background:transparent;font-size:14px;padding:6px;}
.kid-row select{border:none;background:transparent;font-size:20px;width:56px;padding:6px;}
.kid-row .rm{background:none;border:none;color:#B33A2E;font-size:18px;padding:4px 8px;}
.swatches{display:flex;gap:6px;}
.swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.swatch.selected{border-color:var(--charcoal);}

/* ---------- Modal / sheet ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(38,37,31,0.45);display:flex;align-items:flex-end;justify-content:center;
  z-index:50;padding:0;
}
.overlay.center{align-items:center;padding:16px;}
.sheet{
  background:var(--paper);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:22px 20px 28px;
  max-height:85vh;overflow-y:auto;
}
.overlay.center .sheet{border-radius:20px;max-height:90vh;}
.sheet h3{margin:0 0 4px;font-size:18px;}
.sheet .lead{color:var(--charcoal-soft);font-size:13px;margin:0 0 16px;}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:18px 0;}
.pin-dots span{width:16px;height:16px;border-radius:50%;background:var(--border);}
.pin-dots span.filled{background:var(--gold);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.keypad button{padding:16px 0;border-radius:12px;border:1px solid var(--border);background:var(--cream);font-size:18px;font-weight:600;}
.keypad button:active{background:var(--gold-pale);}
.sheet-close-row{display:flex;justify-content:flex-end;margin-top:16px;gap:8px;}
.cat-manage-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.cat-manage-row span.emoji{font-size:18px;width:26px;}
.cat-manage-row input{flex:1;border:none;background:transparent;font-size:14px;}
.cat-manage-row .rm{background:none;border:none;color:#B33A2E;font-size:16px;}
.small-note{font-size:12px;color:var(--charcoal-soft);margin-top:4px;}
.error-text{color:#B33A2E;font-size:12px;margin-top:-8px;margin-bottom:12px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
.toggle{position:relative;width:44px;height:26px;border-radius:999px;background:var(--border);border:none;flex:0 0 auto;}
.toggle.on{background:var(--gold);}
.toggle .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;}
.toggle.on .knob{left:21px;}
.preset-chip{display:inline-block;background:var(--cream);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:12px;margin:0 6px 6px 0;font-weight:600;color:var(--charcoal-soft);}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Samyag Synergy logo">
      <polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="#26251F" stroke-width="3"/>
      <circle cx="50" cy="10" r="4" fill="#C9972E"/><circle cx="90" cy="50" r="4" fill="#C9972E"/>
      <circle cx="50" cy="90" r="4" fill="#C9972E"/><circle cx="10" cy="50" r="4" fill="#C9972E"/>
      <path d="M35 32 L52 50 L35 68" fill="none" stroke="#26251F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M50 32 L67 50 L50 68" fill="none" stroke="#C9972E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand-text">
      <h1>Samyag Synergy</h1>
      <p>Small stars, big bonds</p>
    </div>
  </div>
</header>

<div class="wrap" id="app"></div>
<div id="overlayRoot"></div>

<script>
/* ============ DATA LAYER ============ */
const STORAGE_KEY = 'samyagSynergyData';
const DATA_VERSION = 2;
const DEFAULT_CATEGORIES = [
  {id:'c1', name:'Homework', emoji:'📚'},
  {id:'c2', name:'Chores', emoji:'🧹'},
  {id:'c3', name:'Kindness', emoji:'💛'},
  {id:'c4', name:'Good behavior', emoji:'🌟'},
];
const DEFAULT_HURDLE = {enabled:true, text:'Did you help somebody today?'};
const HURDLE_PRESETS = [
  'What made you proud today?',
  'Did you help somebody today?',
  'What was tricky today?',
  "What's one thing you're grateful for?"
];
const AVATAR_EMOJIS = ['🦁','🐼','🦊','🐯','🐨','🐸','🦄','🐵','🐶','🐱','🦋','🐢'];
const AVATAR_COLORS = ['#F3E4BE','#DCEDE8','#F6DACE','#E4E0F5','#DCEAF6','#F5E3E9'];
const DAY_LETTERS = ['M','T','W','T','F','S','S'];

function defaultData(){
  return {
    version: DATA_VERSION, setupDone:false, familyName:'',
    categories: JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)),
    hurdle: JSON.parse(JSON.stringify(DEFAULT_HURDLE)),
    kids: []
  };
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed.version !== DATA_VERSION) return null; // fresh schema, avoid crashes on old shape
    return parsed;
  }catch(e){ return null; }
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function pad2(n){ return String(n).padStart(2,'0'); }
function localDateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayStr(){ return localDateStr(new Date()); }
function newKid(name, emoji, color){
  return {id:uid(), name, emoji, color, rituals:{},
    weeklyGoal:{target:20, reward:''}, monthlyGoal:{target:80, reward:''}, annualGoal:{target:900, reward:''}};
}

let data = loadData() || defaultData();
let activeTab = 'ritual';    // 'ritual' | 'progress' | 'settings' — everything is open, no login
let ritualActiveKidId = null;
let pendingSetupKids = [{id:uid(), name:'', emoji:AVATAR_EMOJIS[0], color:AVATAR_COLORS[0]}];
let currentRitualItem = null; // {type,id/text} currently shown on the card
let editingItem = null;       // when editing a single already-answered item from the summary

/* ============ DATE HELPERS ============ */
function startOfWeek(d){ const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt; }
function fmt(d){ return localDateStr(d); }
function weekDates(){ const s=startOfWeek(new Date()); const arr=[]; for(let i=0;i<7;i++){ const d=new Date(s); d.setDate(d.getDate()+i); arr.push(fmt(d)); } return arr; }
function monthRange(){ const n=new Date(); return [fmt(new Date(n.getFullYear(),n.getMonth(),1)), fmt(new Date(n.getFullYear(),n.getMonth()+1,0))]; }
function yearRange(){ const n=new Date(); return [`${n.getFullYear()}-01-01`, `${n.getFullYear()}-12-31`]; }
function inRange(ds,s,e){ return ds>=s && ds<=e; }

/* ============ STAR MATH ============ */
function maxDailyStars(){ return Math.max(1, data.categories.length + (data.hurdle.enabled?1:0)); }
function starsForDate(kid, dateStr){
  const r = kid.rituals[dateStr]; if(!r) return 0;
  let s = 0;
  data.categories.forEach(c=>{ if(r.cats && r.cats[c.id]==='yes') s++; });
  if(r.hurdle==='yes') s++;
  return s;
}
function starsInRange(kid, s, e){
  let total=0;
  Object.keys(kid.rituals).forEach(ds=>{ if(inRange(ds,s,e)) total += starsForDate(kid, ds); });
  return total;
}

/* ============ ROOT RENDER ============ */
function render(){
  const app = document.getElementById('app');

  if(!data.setupDone){
    app.innerHTML = renderSetup();
    return;
  }

  let body = '';
  if(data.kids.length===0){
    body = `<div class="empty-state"><h2>Add your first child</h2><p>Head to Settings to add kids and set up categories.</p></div>`;
  } else if(activeTab==='ritual'){
    body = renderRitualTab();
  } else if(activeTab==='progress'){
    body = `<div class="kids-grid">${data.kids.map(k=>progressKidCard(k,true)).join('')}</div>`;
  } else {
    body = renderSettingsTab();
  }

  app.innerHTML = `
    <div class="tabbar">
      <button class="tab-btn ${activeTab==='ritual'?'active':''}" onclick="setTab('ritual')"><span class="ic">🎯</span>Daily ritual</button>
      <button class="tab-btn ${activeTab==='progress'?'active':''}" onclick="setTab('progress')"><span class="ic">📈</span>Progress</button>
      <button class="tab-btn ${activeTab==='settings'?'active':''}" onclick="confirmSettingsAccess()"><span class="ic">⚙️</span>Settings</button>
    </div>
    ${body}
  `;
}
function setTab(t){ activeTab=t; render(); }
function confirmSettingsAccess(){
  const html = `<div class="overlay center" id="ovl"><div class="sheet">
    <h3>⚙️ Parents only</h3>
    <p class="lead">This section changes kids, categories, goals, and rewards. Continue?</p>
    <div class="rc-actions">
      <button class="rc-btn no" onclick="closeOverlay()">Cancel</button>
      <button class="rc-btn yes" onclick="closeOverlay(); setTab('settings');">Continue</button>
    </div>
  </div></div>`;
  showOverlay(html);
}

/* ============ PROGRESS TAB / KID CARD ============ */
function progressKidCard(kid, editable){
  const wd = weekDates();
  const today = todayStr();
  const [ms,me] = monthRange(), [ys,ye] = yearRange();
  const wStars = wd.reduce((sum,d)=>sum+starsForDate(kid,d),0);
  const mStars = starsInRange(kid, ms, me);
  const yStars = starsInRange(kid, ys, ye);
  const wGoal = kid.weeklyGoal, mGoal = kid.monthlyGoal, yGoal = kid.annualGoal;
  const maxDay = maxDailyStars();

  const chart = wd.map((d,i)=>{
    const v = starsForDate(kid,d);
    const h = Math.max(4, Math.round((v/maxDay)*40));
    return `<div class="day-col ${d===today?'today':''}">
      <span class="val">${v}</span>
      <div class="stem"><div class="fill" style="height:${h}px"></div></div>
      <span class="lbl">${DAY_LETTERS[i]}</span>
    </div>`;
  }).join('');

  return `
  <div class="kid-card">
    <div class="kid-head">
      <div class="avatar" style="background:${kid.color}">${kid.emoji}</div>
      <div><h3>${escapeHtml(kid.name)}</h3><div class="sub">${wStars} star${wStars===1?'':'s'} this week</div></div>
    </div>
    <div class="week-chart">${chart}</div>
    ${barRow('This week','week', wStars, wGoal.target, wGoal.reward, kid.id, 'weeklyGoal', editable)}
    ${barRow('This month','month', mStars, mGoal.target, mGoal.reward, kid.id, 'monthlyGoal', editable)}
    ${barRow('This year','year', yStars, yGoal.target, yGoal.reward, kid.id, 'annualGoal', editable)}
  </div>`;
}
function barRow(label, cls, count, target, reward, kidId, goalKey, editable){
  const pct = Math.min(100, Math.round((count/Math.max(1,target))*100));
  return `
  <div class="bar-row">
    <div class="bar-label">
      <span>${label}</span>
      <span class="count">${count}/${target} ⭐ ${editable?`<button class="edit-pencil" onclick="openGoalEdit('${kidId}','${goalKey}')">✎</button>`:''}</span>
    </div>
    <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
    ${reward ? `<span class="reward-pill">🎁 ${escapeHtml(reward)}</span>` : (editable ? `<span class="reward-pill empty">No reward set</span>` : '')}
  </div>`;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

/* ============ RITUAL TAB ============ */
function buildQueue(){
  const q = data.categories.map(c=>({type:'cat', id:c.id, emoji:c.emoji, text:c.name}));
  if(data.hurdle.enabled) q.push({type:'hurdle', id:'hurdle', emoji:'💭', text:data.hurdle.text});
  return q;
}
function getTodayRitual(kid){ return kid.rituals[todayStr()] || {cats:{}, hurdle: undefined}; }
function isAnswered(rit, item){ return item.type==='cat' ? (rit.cats && rit.cats[item.id]!==undefined) : rit.hurdle!==undefined; }
function answerOf(rit, item){ return item.type==='cat' ? (rit.cats||{})[item.id] : rit.hurdle; }

function renderRitualTab(){
  if(!ritualActiveKidId || !data.kids.find(k=>k.id===ritualActiveKidId)) ritualActiveKidId = data.kids[0].id;
  const kid = data.kids.find(k=>k.id===ritualActiveKidId);
  const queue = buildQueue();
  const rit = getTodayRitual(kid);
  const unanswered = queue.filter(item=>!isAnswered(rit,item));

  const kidChips = `<div class="kid-select-row">${data.kids.map(k=>`
    <button class="kid-chip ${k.id===ritualActiveKidId?'active':''}" onclick="selectRitualKid('${k.id}')">
      <span class="av" style="background:${k.color}">${k.emoji}</span>${escapeHtml(k.name)}
    </button>`).join('')}</div>`;

  if(queue.length===0){
    return kidChips + `<div class="empty-state"><h2>No categories yet</h2><p>Add a few in Settings to start today's ritual.</p></div>`;
  }

  let content;
  if(unanswered.length===0){
    const todayStars = starsForDate(kid, todayStr());
    content = `<div class="ritual-done">
      <div class="big-star">⭐</div>
      <h3>All done for today!</h3>
      <p class="lead">${escapeHtml(kid.name)} earned ${todayStars} star${todayStars===1?'':'s'} today.</p>
      ${queue.map(item=>{
        const ans = answerOf(rit,item);
        return `<div class="ritual-summary-row">
          <div class="rs-left"><span>${item.emoji}</span><span>${escapeHtml(item.text)}</span></div>
          <button class="rs-badge ${ans}" onclick='openEditItem(${JSON.stringify(item)})'>${ans==='yes'?'Yes':ans==='no'?'No':'Maybe'}</button>
        </div>`;
      }).join('')}
    </div>`;
  } else {
    const item = unanswered[0];
    const doneCount = queue.length - unanswered.length;
    currentRitualItem = item;
    content = `
      <div class="progress-dots">Question ${doneCount+1} of ${queue.length}</div>
      <div class="ritual-card" id="ritualCard"
        onpointerdown="cardPointerDown(event)" onpointermove="cardPointerMove(event)"
        onpointerup="cardPointerUp(event)" onpointercancel="cardPointerUp(event)">
        <div class="rc-emoji">${item.emoji}</div>
        <div class="rc-text">${escapeHtml(item.text)}</div>
      </div>
      <div class="rc-actions">
        <button class="rc-btn no" onclick="answerCurrent('no')">👎 No</button>
        <button class="rc-btn maybe" onclick="answerCurrent('maybe')">🤔 Maybe</button>
        <button class="rc-btn yes" onclick="answerCurrent('yes')">👍 Yes</button>
      </div>`;
  }

  return kidChips + `<div class="ritual-shell">
    <p class="ritual-caption">Do this together — swipe or tap. A clear "Yes" earns the star, no pressure either way.</p>
    ${content}
  </div>`;
}
function selectRitualKid(id){ ritualActiveKidId = id; render(); }

function recordAnswer(kid, item, ans){
  const t = todayStr();
  if(!kid.rituals[t]) kid.rituals[t] = {cats:{}, hurdle: undefined};
  if(!kid.rituals[t].cats) kid.rituals[t].cats = {};
  if(item.type==='cat') kid.rituals[t].cats[item.id] = ans; else kid.rituals[t].hurdle = ans;
  saveData();
}
function answerCurrent(ans){
  const kid = data.kids.find(k=>k.id===ritualActiveKidId);
  if(!currentRitualItem) return;
  const cardEl = document.getElementById('ritualCard');
  const dir = ans==='yes' ? 1 : ans==='no' ? -1 : 0;
  if(cardEl){
    cardEl.style.transition = 'transform .25s ease, opacity .25s ease';
    cardEl.style.transform = dir!==0 ? `translateX(${dir*420}px) rotate(${dir*16}deg)` : 'translateY(-30px)';
    cardEl.style.opacity = '0';
  }
  recordAnswer(kid, currentRitualItem, ans);
  setTimeout(render, 180);
}
function openEditItem(item){
  const kid = data.kids.find(k=>k.id===ritualActiveKidId);
  const rit = getTodayRitual(kid);
  const cur = answerOf(rit,item);
  const html = `<div class="overlay center" id="ovl"><div class="sheet">
    <h3>${item.emoji} ${escapeHtml(item.text)}</h3>
    <p class="lead">Change today's answer for ${escapeHtml(kid.name)}.</p>
    <div class="rc-actions">
      <button class="rc-btn no" onclick="editAnswer('no')">👎 No</button>
      <button class="rc-btn maybe" onclick="editAnswer('maybe')">🤔 Maybe</button>
      <button class="rc-btn yes" onclick="editAnswer('yes')">👍 Yes</button>
    </div>
    <div class="sheet-close-row"><button class="btn-ghost link-btn" onclick="closeOverlay()">Cancel</button></div>
  </div></div>`;
  editingItem = item;
  showOverlay(html);
}
function editAnswer(ans){
  const kid = data.kids.find(k=>k.id===ritualActiveKidId);
  recordAnswer(kid, editingItem, ans);
  closeOverlay(); render();
}

/* ---- swipe drag handling ---- */
let dragging=false, dragStartX=0, dragEl=null;
function cardPointerDown(e){ dragging=true; dragStartX=e.clientX; dragEl=e.currentTarget; dragEl.setPointerCapture(e.pointerId); dragEl.style.transition='none'; }
function cardPointerMove(e){
  if(!dragging||!dragEl) return;
  const dx = e.clientX - dragStartX;
  dragEl.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
  dragEl.style.opacity = String(1 - Math.min(0.6, Math.abs(dx)/400));
}
function cardPointerUp(e){
  if(!dragging||!dragEl) return;
  const dx = e.clientX - dragStartX;
  dragging=false;
  if(dx>90){ answerCurrent('yes'); }
  else if(dx<-90){ answerCurrent('no'); }
  else { dragEl.style.transition='transform .2s ease, opacity .2s ease'; dragEl.style.transform=''; dragEl.style.opacity='1'; }
}

/* ============ OVERLAY HELPERS ============ */
function showOverlay(html){ document.getElementById('overlayRoot').innerHTML = html; }
function closeOverlay(){ document.getElementById('overlayRoot').innerHTML = ''; }

/* ============ GOAL EDIT ============ */
function openGoalEdit(kidId, goalKey){
  const kid = data.kids.find(k=>k.id===kidId);
  const goal = kid[goalKey];
  const titles = {weeklyGoal:'Weekly goal', monthlyGoal:'Monthly goal', annualGoal:'Annual goal'};
  const html = `<div class="overlay center" id="ovl"><div class="sheet">
    <h3>${titles[goalKey]} — ${escapeHtml(kid.name)}</h3>
    <p class="lead">Set the star target and what they're working toward.</p>
    <div class="field"><label>Star target</label><input type="number" id="goalTarget" min="1" value="${goal.target}"></div>
    <div class="field"><label>Reward (optional)</label><input type="text" id="goalReward" placeholder="e.g. Trip to the park" value="${escapeHtml(goal.reward)}"></div>
    <div class="sheet-close-row">
      <button class="tab-btn" onclick="closeOverlay()">Cancel</button>
      <button class="rc-btn yes" onclick="saveGoal('${kidId}','${goalKey}')">Save</button>
    </div>
  </div></div>`;
  showOverlay(html);
}
function saveGoal(kidId, goalKey){
  const kid = data.kids.find(k=>k.id===kidId);
  const target = Math.max(1, parseInt(document.getElementById('goalTarget').value)||1);
  const reward = document.getElementById('goalReward').value.trim();
  kid[goalKey] = {target, reward};
  saveData(); closeOverlay(); render();
}

/* ============ SETTINGS TAB ============ */
function renderSettingsTab(){
  return `
  <div class="kid-card" style="max-width:560px;margin:0 auto 16px;">
    <h3 style="margin-top:0;">Kids</h3>
    <p class="sub" style="margin-bottom:10px;">${data.kids.length}/10 added.</p>
    ${data.kids.map(k=>`
      <div class="cat-manage-row">
        <span class="emoji">${k.emoji}</span>
        <input type="text" value="${escapeHtml(k.name)}" onchange="renameKid('${k.id}', this.value)">
        <button class="rm" onclick="removeKid('${k.id}')">✕</button>
      </div>`).join('')}
    ${data.kids.length<10 ? `<button class="link-btn" onclick="openAddKid()">+ Add another child</button>` : `<p class="small-note">Max of 10 kids reached.</p>`}
  </div>

  <div class="kid-card" style="max-width:560px;margin:0 auto 16px;">
    <h3 style="margin-top:0;">Star categories</h3>
    <p class="sub" style="margin-bottom:10px;">Each "Yes" answer here earns one star.</p>
    ${data.categories.map(c=>`
      <div class="cat-manage-row">
        <span class="emoji">${c.emoji}</span>
        <input type="text" value="${escapeHtml(c.name)}" onchange="renameCategory('${c.id}', this.value)">
        <button class="rm" onclick="removeCategory('${c.id}')">✕</button>
      </div>`).join('')}
    <button class="link-btn" onclick="addCategory()">+ Add category</button>
  </div>

  <div class="kid-card" style="max-width:560px;margin:0 auto 16px;">
    <h3 style="margin-top:0;">Hurdle question</h3>
    <p class="sub" style="margin-bottom:10px;">One reflection question, optional, worth one star.</p>
    <div class="toggle-row">
      <span style="font-size:14px;font-weight:600;">Ask this daily</span>
      <button class="toggle ${data.hurdle.enabled?'on':''}" onclick="toggleHurdle()"><span class="knob"></span></button>
    </div>
    <div class="field" style="margin-top:10px;"><label>Question</label>
      <input type="text" id="hurdleText" value="${escapeHtml(data.hurdle.text)}" onchange="setHurdleText(this.value)">
    </div>
    <div>${HURDLE_PRESETS.map(p=>`<span class="preset-chip" onclick="setHurdlePreset('${p.replace(/'/g,"\\'")}')" style="cursor:pointer;">${p}</span>`).join('')}</div>
  </div>

  <div class="kid-card" style="max-width:560px;margin:0 auto;">
    <h3 style="margin-top:0;color:#B33A2E;">Danger zone</h3>
    <button class="rc-btn no" style="width:100%;" onclick="resetAllData()">Reset all data</button>
  </div>`;
}
function renameKid(id, val){ const k=data.kids.find(k=>k.id===id); k.name=val.trim()||k.name; saveData(); render(); }
function removeKid(id){ if(!confirm('Remove this child and all their star history?')) return; data.kids = data.kids.filter(k=>k.id!==id); saveData(); render(); }
function renameCategory(id, val){ const c=data.categories.find(c=>c.id===id); c.name=val.trim()||c.name; saveData(); }
function removeCategory(id){ data.categories = data.categories.filter(c=>c.id!==id); saveData(); render(); }
function addCategory(){
  const name = prompt('Category name (e.g. Reading, Sharing):'); if(!name) return;
  const emoji = prompt('Pick an emoji for it (e.g. 📖):','⭐') || '⭐';
  data.categories.push({id:uid(), name:name.trim(), emoji}); saveData(); render();
}
function openAddKid(){
  const name = prompt("Child's name:"); if(!name) return;
  const emoji = AVATAR_EMOJIS[data.kids.length % AVATAR_EMOJIS.length];
  const color = AVATAR_COLORS[data.kids.length % AVATAR_COLORS.length];
  data.kids.push(newKid(name.trim(), emoji, color)); saveData(); render();
}
function toggleHurdle(){ data.hurdle.enabled = !data.hurdle.enabled; saveData(); render(); }
function setHurdleText(val){ data.hurdle.text = val.trim() || data.hurdle.text; saveData(); }
function setHurdlePreset(text){ data.hurdle.text = text; saveData(); render(); }
function resetAllData(){
  if(!confirm('This will erase all kids, stars, and settings. Are you sure?')) return;
  localStorage.removeItem(STORAGE_KEY);
  data = defaultData(); activeTab='ritual'; ritualActiveKidId=null;
  pendingSetupKids=[{id:uid(), name:'', emoji:AVATAR_EMOJIS[0], color:AVATAR_COLORS[0]}];
  closeOverlay(); render();
}

/* ============ SETUP FLOW ============ */
function renderSetup(){
  return `<div class="setup-shell"><div class="setup-card">
    <h2>Welcome to Samyag Synergy</h2>
    <p class="lead">Set up your family in under a minute — one shared space, no logins.</p>

    <div class="field"><label>Family name</label><input type="text" id="setupFamily" placeholder="e.g. The Sharma Family" value="${escapeHtml(data.familyName)}"></div>
    <div id="setupError" class="error-text" style="display:none;"></div>

    <label style="display:block;font-size:13px;font-weight:600;color:var(--charcoal-soft);margin:18px 0 8px;">Add your kids (up to 10)</label>
    <div id="kidRows">${pendingSetupKids.map(kidRowHtml).join('')}</div>
    ${pendingSetupKids.length<10 ? `<button class="link-btn" onclick="addSetupKidRow()">+ Add another child</button>` : ''}

    <div style="margin-top:22px;">
      <button class="rc-btn yes" style="width:100%;padding:14px;font-size:15px;" onclick="finishSetup()">Get started 🎉</button>
    </div>
  </div></div>`;
}
function kidRowHtml(k, i){
  return `<div class="kid-row" data-idx="${i}">
    <select onchange="updateSetupKid(${i},'emoji',this.value)">${AVATAR_EMOJIS.map(e=>`<option value="${e}" ${k.emoji===e?'selected':''}>${e}</option>`).join('')}</select>
    <input type="text" placeholder="Child's name" value="${escapeHtml(k.name)}" onchange="updateSetupKid(${i},'name',this.value)">
    <div class="swatches">${AVATAR_COLORS.map(c=>`<span class="swatch ${k.color===c?'selected':''}" style="background:${c}" onclick="updateSetupKid(${i},'color','${c}')"></span>`).join('')}</div>
    ${pendingSetupKids.length>1 ? `<button class="rm" onclick="removeSetupKidRow(${i})">✕</button>` : ''}
  </div>`;
}
function addSetupKidRow(){
  if(pendingSetupKids.length>=10) return;
  pendingSetupKids.push({id:uid(), name:'', emoji:AVATAR_EMOJIS[pendingSetupKids.length % AVATAR_EMOJIS.length], color:AVATAR_COLORS[pendingSetupKids.length % AVATAR_COLORS.length]});
  render();
}
function removeSetupKidRow(i){ pendingSetupKids.splice(i,1); render(); }
function updateSetupKid(i, key, val){ pendingSetupKids[i][key] = val; if(key!=='name') render(); }

function finishSetup(){
  const family = document.getElementById('setupFamily').value.trim();
  const errEl = document.getElementById('setupError');
  const validKids = pendingSetupKids.filter(k=>k.name && k.name.trim());

  if(validKids.length===0){ errEl.textContent='Add at least one child to continue.'; errEl.style.display='block'; return; }

  data.familyName = family;
  data.kids = validKids.map(k=>newKid(k.name.trim(), k.emoji, k.color));
  data.setupDone = true;
  saveData();
  render();
}

/* ============ INIT ============ */
render();
</script>
