backend:
  name: github
  repo: samyagsynergy/samyag-synergy
  branch: main
  base_url: https://samyagsynergy-oauthclickdeploy.samyagsynergy.workers.dev

# All uploaded images/files (logo, photo, downloads, videos) live in one media library
media_folder: "website/uploads"
public_folder: "/uploads"

publish_mode: simple

collections:

  - name: "settings"
    label: "Site Settings"
    editor:
      preview: false
    files:
      - file: "website/content/settings.json"
        label: "Hero, About & Contact"
        name: "settings"
        fields:
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Brand Name", name: "brand_name", widget: "string" }
          - { label: "Brand Tagline", name: "brand_tagline", widget: "string" }
          - { label: "Hero Heading (use a new line for each line break)", name: "hero_heading", widget: "text" }
          - { label: "Hero Subtext", name: "hero_lede", widget: "text" }
          - { label: "Hero Photo", name: "hero_photo", widget: "image" }
          - { label: "Hero Photo Caption", name: "hero_photo_tag", widget: "string" }
          - { label: "About — Name", name: "about_name", widget: "string" }
          - { label: "About — Credential line", name: "credential_line", widget: "string" }
          - { label: "About — Intro paragraph", name: "about_intro", widget: "text" }
          - { label: "About — Body paragraph", name: "about_body", widget: "text" }
          - label: "Credentials list"
            name: "credentials"
            widget: "list"
            field: { label: "Credential", name: "credential", widget: "string" }
          - label: "Industries list"
            name: "industries"
            widget: "list"
            field: { label: "Industry", name: "industry", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "UEN", name: "uen", widget: "string" }
          - { label: "LinkedIn — Company page URL", name: "linkedin_company", widget: "string" }
          - { label: "LinkedIn — Founder profile URL", name: "linkedin_founder", widget: "string" }
          - { label: "Instagram URL", name: "instagram", widget: "string" }
          - { label: "Events section — intro text", name: "events_intro", widget: "text" }
          - { label: "Footer note", name: "footer_note", widget: "text" }

  - name: "services"
    label: "Services"
    editor:
      preview: false
    files:
      - file: "website/content/services.json"
        label: "Services List"
        name: "services"
        fields:
          - label: "Services"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

  - name: "tools"
    label: "Tools"
    editor:
      preview: false
    files:
      - file: "website/content/tools.json"
        label: "Tools List"
        name: "tools"
        fields:
          - label: "Tools"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["PDF Utilities", "Payroll", "AI Automation", "Reporting", "IFRS Tool", "Quick SME Tools", "XBRL Tool", "Sustainability Reporting", "Compliance Checklist", "Tax Tools", "Accounting", "Other"]
              - { label: "Badge (e.g. Beta) — leave blank for none", name: "badge", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Link URL", name: "link", widget: "string" }
              - { label: "Link button label", name: "link_label", widget: "string" }
              - { label: "Demo video — upload (only for small clips; prefer YouTube below for anything longer)", name: "video", widget: "file", required: false }
              - { label: "Demo video — YouTube URL (preferred)", name: "video_youtube", widget: "string", required: false, hint: "Paste the full YouTube URL, e.g. https://www.youtube.com/watch?v=XXXXXXXXXXX or https://youtu.be/XXXXXXXXXXX" }
              - { label: "Note / disclaimer (optional)", name: "note", widget: "text", required: false }

  - name: "courses"
    label: "Courses"
    editor:
      preview: false
    files:
      - file: "website/content/courses.json"
        label: "Courses List"
        name: "courses"
        fields:
          - label: "Courses"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              # ─── BASIC INFO ───
              - { label: "Course Title", name: "title", widget: "string" }
              - { label: "Subtitle / Tagline", name: "subtitle", widget: "string", required: false }
              - { label: "Slug (URL)", name: "slug", widget: "string", hint: "e.g. ai-fluency-crash-course" }
              - { label: "Status", name: "status", widget: "select", options: ["live", "upcoming", "recorded", "closed"], default: "upcoming" }
              - { label: "Featured Image", name: "image", widget: "image", required: false }
              # ─── COHORT DETAILS ───
              - { label: "Next Cohort Date", name: "cohort_date", widget: "datetime", required: false }
              - { label: "Duration", name: "duration", widget: "string", default: "2 Hours" }
              - { label: "Mode", name: "mode", widget: "select", options: ["Live Online", "In-Person", "Hybrid", "Self-Paced"], default: "Live Online" }
              - { label: "Max Seats", name: "max_seats", widget: "number", value_type: "int", required: false, min: 1 }
              - { label: "Seats Filled", name: "seats_filled", widget: "number", value_type: "int", required: false, min: 0 }
              # ─── PRICING & LINKS ───
              - { label: "Price (SGD)", name: "price", widget: "string", default: "Free" }
              - { label: "Early Bird Price", name: "early_bird_price", widget: "string", required: false }
              - { label: "Early Bird Deadline", name: "early_bird_deadline", widget: "datetime", required: false }
              - { label: "Registration Link", name: "register_link", widget: "string", required: false }
              - { label: "Recording Link", name: "recording_link", widget: "string", required: false }
              - { label: "WhatsApp Group Link", name: "whatsapp_link", widget: "string", required: false }
              - { label: "Feedback Form Link", name: "feedback_link", widget: "string", required: false }
              # ─── INSTRUCTOR ───
              - label: "Instructor"
                name: "instructor"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Name", name: "name", widget: "string", default: "CA Neelukumari Jain" }
                  - { label: "Title", name: "title", widget: "string", default: "Founder, Samyag Synergy" }
                  - { label: "Certification", name: "cert", widget: "string", default: "AI Fluency (ISCA) Certified" }
                  - { label: "Photo", name: "photo", widget: "image", required: false }
              # ─── COURSE CONTENT ───
              - label: "Course Agenda"
                name: "agenda"
                widget: "list"
                collapsed: false
                fields:
                  - { label: "Module Number", name: "number", widget: "string" }
                  - { label: "Module Title", name: "title", widget: "string" }
                  - { label: "Duration", name: "duration", widget: "string", required: false }
                  - { label: "Description", name: "description", widget: "markdown", required: false }
              - label: "Bonus Materials"
                name: "bonus"
                widget: "list"
                collapsed: true
                fields:
                  - { label: "Sr. No.", name: "sr_no", widget: "number", value_type: "int" }
                  - { label: "Item Name", name: "name", widget: "string" }
                  - { label: "Type", name: "type", widget: "select", options: ["Quarterly Audit", "Monthly Register", "Everyday Protection", "Per Project/Assignment"], default: "Everyday Protection" }
              # ─── MARKETING ───
              - { label: "Short Description (for cards)", name: "excerpt", widget: "text", required: false }
              - { label: "Full Description", name: "body", widget: "markdown" }
              - { label: "Pro Tips / Highlights", name: "highlights", widget: "list", required: false, field: { label: "Highlight", name: "highlight", widget: "string" } }
              - { label: "Target Audience", name: "audience", widget: "list", required: false, field: { label: "Audience", name: "item", widget: "string" } }
              - { label: "Prerequisites", name: "prerequisites", widget: "list", required: false, field: { label: "Prerequisite", name: "item", widget: "string" } }
              - { label: "FAQ", name: "faq", widget: "list", required: false, fields:
                  [
                    { label: "Question", name: "question", widget: "string" },
                    { label: "Answer", name: "answer", widget: "markdown" }
                  ]
                }
              # ─── SEO ───
              - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
              - { label: "Meta Description", name: "meta_description", widget: "text", required: false }

  - name: "resources"
    label: "Resources"
    editor:
      preview: false
    files:
      - file: "website/content/resources.json"
        label: "Resources"
        name: "resources"
        fields:
          - label: "Category tags (used for the filter pills)"
            name: "categories"
            widget: "list"
            field: { label: "Category", name: "category", widget: "string" }
          - label: "Featured downloadable resources"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string", hint: "Should match one of the category tags above" }
              - { label: "Badge (e.g. Starter Kit · v1.0)", name: "badge", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - label: "What's included (bullet list)"
                name: "includes"
                widget: "list"
                required: false
                field: { label: "Item", name: "item", widget: "string" }
              - { label: "Primary download link/file", name: "link", widget: "file", required: false }
              - { label: "Primary button label", name: "link_label", widget: "string", required: false }
              - label: "Extra individual file links"
                name: "extra_links"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "File", name: "url", widget: "file" }
              - { label: "Note / disclaimer", name: "note", widget: "text", required: false }
          - label: "Official / external links"
            name: "official_links"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Small tag (e.g. Tax, Compliance)", name: "tag", widget: "string" }
              - { label: "Category", name: "category", widget: "string", hint: "Should match one of the category tags above" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }

  - name: "legal"
    label: "Legal & Privacy"
    editor:
      preview: false
    files:
      - file: "website/content/legal.json"
        label: "Privacy Policy & DPO"
        name: "legal"
        fields:
          - { label: "Data Protection Officer — Name", name: "dpo_name", widget: "string" }
          - { label: "Data Protection Officer — Email", name: "dpo_email", widget: "string" }
          - { label: "Privacy Policy (Markdown)", name: "privacy_policy_body", widget: "markdown" }

  - name: "blog"
    label: "Blog"
    editor:
      preview: false
    files:
      - file: "website/content/blog.json"
        label: "Blog Posts"
        name: "blog"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Byline", name: "byline", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime" }
              - { label: "Body (Markdown)", name: "body", widget: "markdown" }

  - name: "events"
    label: "Events"
    editor:
      preview: false
    files:
      - file: "website/content/events.json"
        label: "Events / Workshops"
        name: "events"
        fields:
          - label: "Events"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{venue}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Tag"
                name: "tag"
                widget: "select"
                options: ["Workshop", "Seminar", "Webinar", "Talk"]
              - { label: "Venue / College", name: "venue", widget: "string" }
              - { label: "Date", name: "date", widget: "date" }
              - { label: "Duration", name: "duration", widget: "string", required: false }
              - { label: "Fee", name: "fee", widget: "string", required: false }
              - { label: "Short summary (shown on the card)", name: "summary", widget: "text" }
              - { label: "Full description (shown on details)", name: "description", widget: "text" }
              - label: "Highlights / what students learn"
                name: "highlights"
                widget: "list"
                required: false
                field: { label: "Point", name: "point", widget: "string" }
              - label: "Photos"
                name: "photos"
                widget: "list"
                required: false
                field: { label: "Photo", name: "photo", widget: "image" }
              - label: "Videos (YouTube URLs)"
                name: "videos"
                widget: "list"
                required: false
                field: { label: "YouTube URL", name: "url", widget: "string" }
              - label: "Testimonials"
                name: "testimonials"
                widget: "list"
                required: false
                fields:
                  - { label: "Quote", name: "quote", widget: "text" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "College / Role", name: "role", widget: "string", required: false }
